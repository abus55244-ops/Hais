<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1F3B2C" />
<title>খেরোখাতা — ব্যক্তিগত সহায়ক</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<style>
:root{
  --green:#1F3B2C;
  --green-deep:#132A1D;
  --stone:#F2F1EC;
  --card:#FFFFFF;
  --gold:#B8863B;
  --gold-light:#D9B579;
  --brick:#A6432E;
  --sage:#5B7A63;
  --plum:#6B4A6E;
  --slate:#3E5C76;
  --ochre:#8C6D34;
  --ink:#1C1F1B;
  --muted:#6E7268;
  --line:#E1DED2;
  --radius:14px;
  --shadow:0 2px 10px rgba(28,31,27,0.06), 0 1px 2px rgba(28,31,27,0.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--stone);
  color:var(--ink);
  font-family:'Hind Siliguri', sans-serif;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{ font-family:'Tiro Bangla', serif; font-weight:400; }
button{font-family:inherit;}
::selection{background:var(--gold-light); color:var(--green-deep);}

#root{max-width:520px; margin:0 auto; min-height:100vh; background:var(--stone); position:relative; padding-bottom:88px;}

/* ---------- Header ---------- */
.app-header{
  background:linear-gradient(160deg, var(--green) 0%, var(--green-deep) 100%);
  color:var(--stone);
  padding:22px 20px 26px;
  border-bottom:3px solid var(--gold);
  position:relative;
  overflow:hidden;
}
.app-header::after{
  content:"";
  position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background-image:repeating-linear-gradient(90deg, var(--gold) 0 8px, transparent 8px 16px);
  opacity:0.6;
}
.app-title{ font-size:22px; letter-spacing:0.5px; margin:0; color:#fff;}
.app-sub{ font-size:13px; color:var(--gold-light); margin-top:4px; opacity:0.9;}
.header-date{ font-size:13px; color:rgba(242,241,236,0.75); margin-top:14px;}
.header-greet{ font-size:17px; margin-top:2px; font-weight:600;}

/* ---------- Stitch divider (signature element) ---------- */
.stitch{
  height:1px;
  margin:18px 0;
  background-image:repeating-linear-gradient(90deg, var(--line) 0 7px, transparent 7px 14px);
}
.stitch.gold{ background-image:repeating-linear-gradient(90deg, var(--gold) 0 7px, transparent 7px 14px); opacity:0.7;}

/* ---------- Layout ---------- */
.page{ padding:18px 18px 6px; }
.section-title{
  font-size:15px; color:var(--muted); font-weight:600; margin:0 0 10px 2px;
  display:flex; align-items:center; justify-content:space-between;
}
.section-title .tag{ font-size:11px; font-weight:600; color:var(--gold); background:rgba(184,134,59,0.12); padding:2px 8px; border-radius:20px;}

/* ---------- Cards ---------- */
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px 16px;
  margin-bottom:12px;
  border:1px solid rgba(0,0,0,0.03);
}
.card.tab-accent{ border-left:4px solid var(--accent, var(--gold)); }

/* ---------- Dashboard hero ---------- */
.hero-card{
  background:var(--card);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:18px;
  margin:-18px 18px 18px;
  position:relative;
  border-top:3px solid var(--gold);
}
.hero-row{ display:flex; gap:10px; margin-top:10px;}
.hero-stat{ flex:1; text-align:center; padding:10px 4px; border-radius:10px; background:var(--stone);}
.hero-stat .num{ font-family:'Tiro Bangla',serif; font-size:22px; color:var(--green);}
.hero-stat .lbl{ font-size:11.5px; color:var(--muted); margin-top:2px;}

/* ---------- Current waqt banner ---------- */
.waqt-banner{
  margin:-18px 18px 14px; background:var(--card); border-radius:16px; box-shadow:var(--shadow);
  padding:14px 18px; border-top:3px solid var(--sage); display:flex; align-items:center; justify-content:space-between;
}
.waqt-banner .lbl{ font-size:12px; color:var(--muted); }
.waqt-banner .now{ font-family:'Tiro Bangla',serif; font-size:20px; color:var(--green); margin-top:2px;}
.waqt-banner .next{ text-align:right; font-size:11.5px; color:var(--muted); }
.waqt-banner .next b{ color:var(--sage); font-weight:700; }

/* ---------- Highlighted daily hadith ---------- */
.hadith-card{
  margin:0 18px 18px; border-radius:16px; padding:18px 18px 16px;
  background:linear-gradient(160deg, var(--green) 0%, var(--green-deep) 100%);
  color:var(--stone); border:1px solid var(--gold); box-shadow:0 4px 16px rgba(19,42,29,0.25);
  position:relative;
}
.hadith-card .kicker{ font-size:11px; letter-spacing:0.6px; color:var(--gold-light); font-weight:700; }
.hadith-card .qmark{ font-family:'Tiro Bangla',serif; font-size:34px; color:var(--gold); line-height:0.5; position:absolute; top:12px; right:16px; opacity:0.55;}
.hadith-card .text{ font-family:'Tiro Bangla',serif; font-size:16.5px; line-height:1.85; margin-top:10px; color:#fff; }
.hadith-card .src{ font-size:11.5px; color:rgba(242,241,236,0.7); margin-top:12px; }

/* ---------- Checklist rows ---------- */
.row{ display:flex; align-items:center; gap:12px; padding:9px 0; }
.row + .row{ border-top:1px dashed var(--line); }
.chk{
  width:22px; height:22px; border-radius:6px; border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;
  transition:all .15s ease;
}
.chk.done{ background:var(--sage); border-color:var(--sage); color:#fff; }
.row-title{ font-size:14.5px; flex:1; }
.row-title.done{ text-decoration:line-through; color:var(--muted); }
.row-meta{ font-size:11.5px; color:var(--muted); }
.pill{
  font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; white-space:nowrap;
}

/* ---------- Bottom nav (ledger tabs) ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0;
  max-width:520px; margin:0 auto;
  background:var(--green-deep);
  display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 12px rgba(0,0,0,0.18);
  z-index:50;
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 2px 6px; border:none; background:none; cursor:pointer; position:relative;
  color:rgba(242,241,236,0.55); font-size:10.5px;
}
.tab .dot{ width:16px; height:4px; border-radius:3px; background:transparent; margin-bottom:1px; transition:all .15s;}
.tab.active{ color:#fff; }
.tab.active .dot{ background:var(--tabcolor, var(--gold)); width:22px; }
.tab svg{ width:20px; height:20px; }

/* ---------- Floating add button ---------- */
.fab{
  position:fixed; right:calc(18px + (100vw - 520px) / 2); bottom:82px;
  width:54px; height:54px; border-radius:50%;
  background:var(--gold); color:#fff; border:none; font-size:26px;
  box-shadow:0 4px 14px rgba(184,134,59,0.45);
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:45;
}
@media (max-width:520px){ .fab{ right:18px; } }

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(19,42,29,0.45); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.sheet{
  background:var(--card); width:100%; max-width:520px; border-radius:20px 20px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  animation:slideUp .2s ease;
}
@keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
.sheet h2{ font-size:19px; margin:0 0 14px; color:var(--green-deep); }
.field{ margin-bottom:12px; }
.field label{ font-size:12.5px; color:var(--muted); display:block; margin-bottom:5px; font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px;
  font-family:inherit; font-size:14.5px; background:var(--stone); color:var(--ink);
}
.field textarea{ min-height:70px; resize:vertical; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--gold-light); border-color:var(--gold); }
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{
  padding:7px 13px; border-radius:20px; border:1.5px solid var(--line); background:var(--stone);
  font-size:13px; cursor:pointer; color:var(--muted);
}
.chip.sel{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, white); color:var(--accent); font-weight:600;}
.btn{
  width:100%; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:600;
  cursor:pointer; margin-top:6px;
}
.btn-primary{ background:var(--green); color:#fff; }
.btn-ghost{ background:none; color:var(--muted); }
.btn-danger{ background:none; color:var(--brick); font-size:13px; text-align:center; }

/* ---------- Empty state ---------- */
.empty{ text-align:center; padding:34px 10px; color:var(--muted); }
.empty .glyph{ font-size:30px; margin-bottom:8px; opacity:.5; }
.empty .msg{ font-size:13.5px; }

/* ---------- Calendar ---------- */
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px;}
.cal-dow{ text-align:center; font-size:11px; color:var(--muted); font-weight:600; padding-bottom:4px;}
.cal-day{
  aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:13px; cursor:pointer; position:relative; background:var(--card); border:1px solid transparent; color:var(--ink);
}
.cal-day.muted{ color:var(--line); }
.cal-day.today{ border-color:var(--gold); font-weight:700; }
.cal-day.sel{ background:var(--green); color:#fff; }
.cal-day .marks{ display:flex; gap:2px; margin-top:3px; }
.cal-day .marks span{ width:5px; height:5px; border-radius:50%; }

/* ---------- Habit heat ---------- */
.habit-week{ display:flex; gap:5px; }
.hcell{ width:24px; height:24px; border-radius:6px; background:var(--stone); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); cursor:pointer;}
.hcell.on{ background:var(--sage); border-color:var(--sage); color:#fff; }

/* ---------- Goal progress ---------- */
.progress-track{ height:8px; background:var(--stone); border-radius:6px; overflow:hidden; margin-top:8px;}
.progress-fill{ height:100%; background:var(--plum); border-radius:6px; transition:width .3s ease; }

/* ---------- Expenses ---------- */
.exp-total{ font-family:'Tiro Bangla',serif; font-size:26px; color:var(--ochre); }
.exp-cat-bar{ display:flex; height:10px; border-radius:6px; overflow:hidden; margin:10px 0; }

/* ---------- Notes ---------- */
.note-card{ white-space:pre-wrap; font-size:13.5px; line-height:1.6; color:var(--ink); }
.note-date{ font-size:11px; color:var(--muted); margin-top:8px; }

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:150px; left:50%; transform:translateX(-50%);
  background:var(--green-deep); color:#fff; padding:10px 18px; border-radius:24px; font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,0.25); z-index:200; animation:toastIn .2s ease;
}
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }

::-webkit-scrollbar{ width:0; height:0; }

.icon-btn{
  width:28px; height:28px; flex-shrink:0; border:none; background:transparent; color:var(--muted);
  display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; padding:0;
}
.icon-btn svg{ width:15px; height:15px; }
.icon-btn:hover, .icon-btn:active{ background:rgba(91,122,99,0.14); color:var(--sage); }
.kind-label{
  font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:0.3px; text-transform:uppercase;
  margin:12px 0 4px 2px; opacity:0.75;
}
.kind-label:first-child{ margin-top:0; }
.diary-progress-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.diary-progress-row .progress-track{ flex:1; margin-top:0; }
.diary-progress-row .count{ font-size:12.5px; font-weight:700; color:var(--sage); white-space:nowrap; }
.circ-btn{
  width:26px; height:26px; flex-shrink:0; border-radius:50%; border:1.5px solid var(--line); background:transparent;
  color:var(--muted); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
}
.circ-btn svg{ width:13px; height:13px; }
.circ-btn.active{ background:var(--slate); border-color:var(--slate); color:#fff; }
.agenda-legend{ font-size:11px; color:var(--muted); display:flex; align-items:center; margin-bottom:8px; }
.agenda-legend .circ-btn{ pointer-events:none; }
.linked-tag{
  font-size:11px; padding:2px 8px; border-radius:20px; background:rgba(107,74,110,0.12); color:var(--plum); font-weight:600;
}
</style>
</head>
<body>
<div id="root">
  <div id="boot-fallback" style="max-width:520px;margin:60px auto;text-align:center;font-family:sans-serif;color:#6E7268;padding:0 20px;">
    <div style="font-size:14px;">অ্যাপ লোড হচ্ছে…</div>
    <div id="boot-error" style="margin-top:10px;font-size:12.5px;color:#A6432E;"></div>
  </div>
</div>
<script>
  window.addEventListener("error", function(e){
    var msg = (e.message || (e.error && e.error.message) || "unknown");
    var el = document.getElementById("boot-error");
    if(el){ el.textContent = "লোড এরর: " + msg; return; }
    // React has already mounted and replaced #root — show a floating banner instead of a silent white screen
    var bar = document.getElementById("runtime-error-bar");
    if(!bar){
      bar = document.createElement("div");
      bar.id = "runtime-error-bar";
      bar.style.cssText = "position:fixed;top:0;left:0;right:0;background:#A6432E;color:#fff;padding:10px 14px;font-size:12.5px;z-index:99999;font-family:sans-serif;";
      document.body.appendChild(bar);
    }
    bar.textContent = "একটি এরর হয়েছে: " + msg;
  });
</script>

<script type="text/babel" data-presets="react,env">
const {useState, useEffect, useMemo, useRef, useCallback} = React;

/* ===================== Firebase (optional) ===================== */
/* এখানে আপনার নিজের Firebase কনফিগ বসান — না বসালে অ্যাপ localStorage-এ কাজ করবে */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDXGKBRLhuXxe9s1OPZvL94RlCJJaXDdWM",
  authDomain: "personal-3a780.firebaseapp.com",
  databaseURL: "https://personal-3a780-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "personal-3a780",
  storageBucket: "personal-3a780.firebasestorage.app",
  messagingSenderId: "876949145313",
  appId: "1:876949145313:web:42ab41ba44de214586d9a0"
};
let fbApp = null, fbDb = null;
function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
async function initFirebaseIfConfigured(){
  if(!FIREBASE_CONFIG) return;
  try{
    await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js");
    await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js");
    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.database();
  }catch(e){ console.warn("firebase init failed", e); }
}
const firebaseReadyPromise = initFirebaseIfConfigured();

/* ===================== Storage layer ===================== */
const STORE_KEY = "kherokhata_v1";
const DEFAULT_HABITS = [
  {id:"habit_fajr", title:"ফজর", kind:"prayer", prayerKey:"Fajr"},
  {id:"habit_dhuhr", title:"যোহর", kind:"prayer", prayerKey:"Dhuhr"},
  {id:"habit_asr", title:"আসর", kind:"prayer", prayerKey:"Asr"},
  {id:"habit_maghrib", title:"মাগরিব", kind:"prayer", prayerKey:"Maghrib"},
  {id:"habit_isha", title:"এশা", kind:"prayer", prayerKey:"Isha"},
  {id:"habit_quran", title:"কুরআন তিলাওয়াত", kind:"reading"},
  {id:"habit_hadith", title:"হাদিস পাঠ", kind:"reading"},
  {id:"habit_shahitya", title:"সাহিত্য পাঠ", kind:"reading"},
];
function migrateHabits(habits){
  let list = Array.isArray(habits) ? habits.slice() : [];
  const hasAnyPrayer = list.some(h=>h.kind==="prayer");
  list = list.filter(h=>h.id!=="habit_salah"); // drop old combined prayer item
  if(!hasAnyPrayer){
    list = [...DEFAULT_HABITS.filter(h=>h.kind==="prayer"), ...list];
  }
  list = list.map(h=>{
    if(h.id==="habit_quran" && !h.kind) return {...h, kind:"reading", title:"কুরআন তিলাওয়াত"};
    if(h.id==="habit_shahitya" && !h.kind) return {...h, kind:"reading", title:"সাহিত্য পাঠ"};
    if(!h.kind) return {...h, kind:"custom"};
    return h;
  });
  if(!list.some(h=>h.id==="habit_hadith")){
    const idx = list.findIndex(h=>h.id==="habit_quran");
    const hadith = {id:"habit_hadith", title:"হাদিস পাঠ", kind:"reading"};
    if(idx>=0) list.splice(idx+1,0,hadith); else list.push(hadith);
  }
  return list;
}
const DEFAULT_ACCOUNTS = [
  {id:"acc_cash", name:"ক্যাশ", openingBalance:0},
  {id:"acc_bank", name:"ব্যাংক", openingBalance:0},
  {id:"acc_mobile", name:"মোবাইল ব্যাংকিং", openingBalance:0},
];
function freshState(){
  return { tasks:[], events:[], habits:[...DEFAULT_HABITS], habitLogs:{}, goals:[], notes:[],
           accounts:[...DEFAULT_ACCOUNTS], transactions:[], budgets:{}, routines:[], meetingPoints:[], debts:[] };
}
function migrateState(raw){
  const s = raw || {};
  // Firebase RTDB drops empty arrays/objects entirely on write, so every
  // field must be defensively defaulted here on every read, not just once.
  if(!Array.isArray(s.tasks)) s.tasks = [];
  if(!Array.isArray(s.events)) s.events = [];
  if(!Array.isArray(s.habits)) s.habits = [];
  s.habits = migrateHabits(s.habits);
  if(!s.habitLogs || typeof s.habitLogs !== "object") s.habitLogs = {};
  if(!Array.isArray(s.goals)) s.goals = [];
  if(!Array.isArray(s.notes)) s.notes = [];
  if(!Array.isArray(s.accounts) || s.accounts.length===0) s.accounts = [...DEFAULT_ACCOUNTS];
  if(!s.budgets || typeof s.budgets !== "object") s.budgets = {};
  if(s.budgets.food !== undefined && s.budgets.grocery === undefined){ s.budgets.grocery = s.budgets.food; }
  delete s.budgets.food;
  if(!Array.isArray(s.routines)) s.routines = [];
  if(!Array.isArray(s.meetingPoints)) s.meetingPoints = [];
  if(!Array.isArray(s.debts)) s.debts = [];
  if(!Array.isArray(s.transactions)){
    s.transactions = (Array.isArray(s.expenses) ? s.expenses : []).map(e=>({
      id:e.id, type:"expense", amount:Number(e.amount||0), category:e.category||"other",
      accountId: s.accounts[0].id, note:e.note||"", date:e.date
    }));
  }
  s.transactions = s.transactions.map(t=> t.category==="food" ? {...t, category:"grocery"} : t);
  delete s.expenses;
  return s;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return migrateState(JSON.parse(raw));
  }catch(e){}
  return freshState();
}
function saveState(state){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  if(fbDb){ try{ fbDb.ref("kherokhata").set(state); }catch(e){} }
}

/* ===================== Date helpers ===================== */
const BN_DIGITS = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
function toBn(n){ return String(n).split("").map(c => /[0-9]/.test(c) ? BN_DIGITS[+c] : c).join(""); }
const BN_MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const BN_DAYS = ["রবি","সোম","মঙ্গল","বুধ","বৃহস্পতি","শুক্র","শনি"];
const BN_DAYS_SHORT = ["র","সো","ম","বু","বৃ","শু","শ"];
function fmtDate(d){
  const dt = new Date(d);
  return `${toBn(dt.getDate())} ${BN_MONTHS[dt.getMonth()]}, ${toBn(dt.getFullYear())}`;
}
function isoDate(d){ const dt=new Date(d); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function todayIso(){ return isoDate(new Date()); }
function greeting(){
  const h = new Date().getHours();
  if(h<12) return "শুভ সকাল";
  if(h<16) return "শুভ দুপুর";
  if(h<19) return "শুভ বিকাল";
  return "শুভ সন্ধ্যা";
}

/* ===================== Prayer times (Aladhan API, University of Islamic
   Sciences Karachi method — standard for Bangladesh/South Asia) ===================== */
const DHAKA_COORDS = {lat:23.8103, lng:90.4125};
function usePrayerTimes(){
  const [times, setTimes] = useState(null);
  const [status, setStatus] = useState("loading"); // loading | ok | error
  useEffect(()=>{
    let cancelled = false;
    const today = todayIso();
    const cacheKey = "kherokhata_prayer_" + today;
    try{
      const cached = localStorage.getItem(cacheKey);
      if(cached){ setTimes(JSON.parse(cached)); setStatus("ok"); return; }
    }catch(e){}
    function fetchWithCoords(lat, lng){
      const [y,m,d] = today.split("-");
      const url = "https://api.aladhan.com/v1/timings/"+d+"-"+m+"-"+y+"?latitude="+lat+"&longitude="+lng+"&method=1";
      fetch(url).then(r=>r.json()).then(j=>{
        if(cancelled) return;
        if(j && j.data && j.data.timings){
          const t = j.data.timings;
          const clean = k => (t[k]||"").split(" ")[0];
          const result = {Fajr:clean("Fajr"), Dhuhr:clean("Dhuhr"), Asr:clean("Asr"), Maghrib:clean("Maghrib"), Isha:clean("Isha")};
          setTimes(result); setStatus("ok");
          try{ localStorage.setItem(cacheKey, JSON.stringify(result)); }catch(e){}
        } else { setStatus("error"); }
      }).catch(()=>{ if(!cancelled) setStatus("error"); });
    }
    if("geolocation" in navigator){
      navigator.geolocation.getCurrentPosition(
        pos=>fetchWithCoords(pos.coords.latitude, pos.coords.longitude),
        ()=>fetchWithCoords(DHAKA_COORDS.lat, DHAKA_COORDS.lng),
        {timeout:5000}
      );
    } else {
      fetchWithCoords(DHAKA_COORDS.lat, DHAKA_COORDS.lng);
    }
    return ()=>{ cancelled = true; };
  }, []);
  return {times, status};
}

/* ===================== Current waqt (prayer period) ===================== */
function currentPeriod(times){
  if(!times) return null;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const toMin = (hhmm)=>{ if(!hhmm) return null; const [h,m] = hhmm.split(":").map(Number); return h*60+m; };
  const marks = [
    {key:"Fajr", label:"ফজর", min: toMin(times.Fajr)},
    {key:"Dhuhr", label:"যোহর", min: toMin(times.Dhuhr)},
    {key:"Asr", label:"আসর", min: toMin(times.Asr)},
    {key:"Maghrib", label:"মাগরিব", min: toMin(times.Maghrib)},
    {key:"Isha", label:"এশা", min: toMin(times.Isha)},
  ].filter(m=>m.min!==null);
  if(marks.length===0) return null;
  let current = marks[marks.length-1]; // before today's Fajr, we're still in last night's Isha period
  for(let i=0;i<marks.length;i++){ if(nowMin >= marks[i].min) current = marks[i]; }
  let next = marks.find(m=>m.min > nowMin);
  let nextMin = next ? next.min : marks[0].min + 24*60;
  if(!next) next = marks[0];
  const remain = nextMin - nowMin;
  const hh = Math.floor(remain/60), mm = remain%60;
  const remainText = (hh>0 ? toBn(hh)+" ঘ. " : "") + toBn(mm)+" মি.";
  return {current, next, remainText};
}
function findActiveRoutine(routines, now){
  now = now || new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const toMin = (hhmm)=>{ if(!hhmm) return null; const [h,m] = hhmm.split(":").map(Number); return h*60+m; };
  for(const r of (routines||[])){
    const s = toMin(r.startTime), e = toMin(r.endTime);
    if(s===null || e===null) continue;
    if(e > s){ if(nowMin>=s && nowMin<e) return r; }
    else { if(nowMin>=s || nowMin<e) return r; } // crosses midnight
  }
  return null;
}

/* Keywords used to filter the full Bukhari collection down to daily
   mu'amalat/mu'asharat (dealings & manners) hadiths. Since the whole
   Sahih Bukhari collection is authentic by scholarly consensus, this
   filtering only affects topical relevance, never authenticity. */
const HADITH_KEYWORDS = ["প্রতিবেশ","ব্যবসা","ঋণ","সালাম","ক্ষমা","রাগ","ওয়াদা","মেহমান","আত্মীয়","আমানত","মিথ্যা","জুলুম","ভাই","হাসি","দান","সদকা","ন্যায়","অধিকার","সাক্ষাৎ","লেনদেন","ক্রয়","বিক্রয়"];
const HADITH_ONLINE_SOURCE_URL = "https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ben-bukhari.min.json";

function useDailyHadith(){
  const [hadith, setHadith] = useState(null);
  useEffect(()=>{
    let cancelled = false;
    function fallbackCurated(){
      let idx = 0;
      try{
        const prev = parseInt(localStorage.getItem("kherokhata_hadith_idx"), 10);
        idx = isNaN(prev) ? 0 : (prev+1) % HADITH_LIST.length;
        localStorage.setItem("kherokhata_hadith_idx", String(idx));
      }catch(e){ idx = Math.floor(Math.random()*HADITH_LIST.length); }
      if(!cancelled) setHadith(HADITH_LIST[idx]);
    }
    async function tryOnline(){
      try{
        let list;
        const cached = localStorage.getItem("kherokhata_bukhari_ben_v1");
        if(cached){
          list = JSON.parse(cached);
        } else {
          const res = await fetch(HADITH_ONLINE_SOURCE_URL);
          if(!res.ok) throw new Error("fetch failed: "+res.status);
          const j = await res.json();
          list = (j && Array.isArray(j.hadiths)) ? j.hadiths : [];
          if(list.length===0) throw new Error("empty edition");
          try{ localStorage.setItem("kherokhata_bukhari_ben_v1", JSON.stringify(list)); }catch(e){ /* storage full — still usable this session */ }
        }
        const matches = list.filter(h=>h.text && HADITH_KEYWORDS.some(k=>h.text.indexOf(k)>=0));
        const pool = matches.length>0 ? matches : list;
        let idx = 0;
        const prev = parseInt(localStorage.getItem("kherokhata_hadith_online_idx"), 10);
        idx = isNaN(prev) ? 0 : (prev+1) % pool.length;
        localStorage.setItem("kherokhata_hadith_online_idx", String(idx));
        const picked = pool[idx];
        if(cancelled) return;
        if(picked && picked.text){
          setHadith({text: picked.text, source: "সহীহ বুখারী, হাদিস নং "+picked.hadithnumber});
        } else {
          fallbackCurated();
        }
      }catch(e){
        if(!cancelled) fallbackCurated();
      }
    }
    tryOnline();
    return ()=>{ cancelled = true; };
  }, []);
  return hadith;
}

/* ===================== Notifications ===================== */
function ensureNotifPermission(){
  if("Notification" in window && Notification.permission === "default"){
    Notification.requestPermission();
  }
}
function checkDueReminders(state){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const now = new Date();
  const nowIso = todayIso();
  const key = "kherokhata_notified_" + nowIso;
  let notified = {};
  try{ notified = JSON.parse(sessionStorage.getItem(key) || "{}"); }catch(e){}
  state.tasks.forEach(t=>{
    if(t.done || !t.dueDate || !t.dueTime) return;
    if(t.dueDate !== nowIso) return;
    const due = new Date(t.dueDate+"T"+t.dueTime);
    const diffMin = (due - now)/60000;
    if(diffMin <= 0 && diffMin > -5 && !notified["task_"+t.id]){
      new Notification("খেরোখাতা · টাস্ক", { body: t.title, icon:"icon-192.png" });
      notified["task_"+t.id] = true;
    }
  });
  try{ sessionStorage.setItem(key, JSON.stringify(notified)); }catch(e){}
}

}

/* ===================== App ===================== */
function App(){
  const [state, setState] = useState(loadState);
  const [tab, setTab] = useState("dashboard");
  const [modal, setModal] = useState(null); // {type:"task"|"event"|"habit"|"goal"|"note"|"expense", data?}
  const [toast, setToast] = useState("");
  const [selectedDate, setSelectedDate] = useState(todayIso());
  const prayer = usePrayerTimes();

  useEffect(()=>{ saveState(state); }, [state]);
  useEffect(()=>{
    let ref = null;
    firebaseReadyPromise.then(()=>{
      if(!fbDb) return;
      ref = fbDb.ref("kherokhata");
      ref.on("value", (snap)=>{
        const val = snap.val();
        if(!val) return;
        const migrated = migrateState(val);
        setState(prev => JSON.stringify(prev) === JSON.stringify(migrated) ? prev : migrated);
      });
    });
    return ()=>{ if(ref) ref.off("value"); };
  }, []);
  useEffect(()=>{
    ensureNotifPermission();
    const iv = setInterval(()=>checkDueReminders(state), 60000);
    checkDueReminders(state);
    return ()=>clearInterval(iv);
  }, [state]);
  useEffect(()=>{
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    }
  }, []);
  useEffect(()=>{
    if(!toast) return;
    const t = setTimeout(()=>setToast(""), 2200);
    return ()=>clearTimeout(t);
  }, [toast]);

  const showToast = (msg)=> setToast(msg);

  /* ---- generic CRUD helpers ---- */
  const addItem = (col, item)=> setState(s=>({...s, [col]:[...s[col], item]}));
  const updateItem = (col, id, patch)=> setState(s=>({...s, [col]: s[col].map(x=>x.id===id?{...x,...patch}:x)}));
  const removeItem = (col, id)=> setState(s=>({...s, [col]: s[col].filter(x=>x.id!==id)}));
  const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const toggleHabit = (habitId, iso)=> setState(s=>{
    const logs = {...s.habitLogs};
    const dayLog = {...(logs[iso]||{})};
    dayLog[habitId] = !dayLog[habitId];
    logs[iso] = dayLog;
    return {...s, habitLogs:logs};
  });

  /* ---- derived ---- */

  const openAdd = (type)=> setModal({type, data:null});
  const openEdit = (type, data)=> setModal({type, data});
  const closeModal = ()=> setModal(null);

  const fabAction = ()=>{
    const map = {dashboard:"task", tasks:"task", calendar:"event", habits:"habit", goals:"goal", notes:"note", expenses:"transaction"};
    openAdd(map[tab] || "task");
  };

  return (
    <React.Fragment>
      <Header state={state} />
      <div className="page" style={{paddingTop: tab==="dashboard" ? 0 : 4}}>
        {tab==="dashboard" && <Dashboard state={state} updateItem={updateItem} toggleHabit={toggleHabit} setTab={setTab} openAdd={openAdd} openEdit={openEdit} showToast={showToast} prayer={prayer} />}
        {tab==="tasks" && <TasksView state={state} updateItem={updateItem} removeItem={removeItem} openAdd={openAdd} openEdit={openEdit} />}
        {tab==="calendar" && <CalendarView state={state} selectedDate={selectedDate} setSelectedDate={setSelectedDate} openAdd={openAdd} openEdit={openEdit} removeItem={removeItem} />}
        {tab==="habits" && <DailyLogView state={state} updateItem={updateItem} setState={setState} addItem={addItem} uid={uid} openAdd={openAdd} openEdit={openEdit} removeItem={removeItem} prayer={prayer} />}
        {tab==="goals" && <GoalsView state={state} updateItem={updateItem} removeItem={removeItem} openAdd={openAdd} openEdit={openEdit} />}
        {tab==="notes" && <NotesView state={state} openAdd={openAdd} openEdit={openEdit} removeItem={removeItem} />}
        {tab==="expenses" && <MoneyView state={state} setState={setState} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} openAdd={openAdd} openEdit={openEdit} showToast={showToast} />}
      </div>

      <button className="fab" onClick={fabAction} aria-label="নতুন যোগ করুন">+</button>

      <nav className="tabbar">
        {MODULES.map(m=>(
          <button key={m.key} className={"tab"+(tab===m.key?" active":"")} style={{"--tabcolor":m.color}} onClick={()=>setTab(m.key)}>
            <span className="dot"></span>
            {m.icon}
            <span>{m.label}</span>
          </button>
        ))}
      </nav>

      {modal && (
        <ModalRouter
          modal={modal} state={state}
          addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid}
          onClose={closeModal} showToast={showToast}
        />
      )}
      <Toast text={toast} />
    </React.Fragment>
  );
}

/* ===================== Calendar ===================== */
function CalendarView({state, selectedDate, setSelectedDate, openAdd, openEdit, removeItem}){
  const [cursor, setCursor] = useState(()=>{ const d=new Date(); d.setDate(1); return d; });
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const itemsFor = (iso)=>({
    tasks: state.tasks.filter(t=>t.dueDate===iso),
    events: state.events.filter(e=>e.date===iso),
  });
  const dayItems = itemsFor(selectedDate);

  return (
    <React.Fragment>
      <div className="card">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
          <button className="btn-ghost" style={{width:"auto", padding:"4px 10px"}} onClick={()=>setCursor(new Date(year, month-1, 1))}>‹</button>
          <div style={{fontWeight:700}}>{BN_MONTHS[month]} {toBn(year)}</div>
          <button className="btn-ghost" style={{width:"auto", padding:"4px 10px"}} onClick={()=>setCursor(new Date(year, month+1, 1))}>›</button>
        </div>
        <div className="cal-grid">
          {BN_DAYS_SHORT.map((d,i)=><div className="cal-dow" key={i}>{d}</div>)}
          {cells.map((d,i)=>{
            if(!d) return <div key={i}></div>;
            const iso = isoDate(new Date(year, month, d));
            const its = itemsFor(iso);
            const marks = [];
            if(its.tasks.length) marks.push("var(--brick)");
            if(its.events.length) marks.push("var(--gold)");
            return (
              <div key={i}
                className={"cal-day"+(iso===todayIso()?" today":"")+(iso===selectedDate?" sel":"")}
                onClick={()=>setSelectedDate(iso)}>
                {toBn(d)}
                <div className="marks">{marks.map((c,idx)=><span key={idx} style={{background:c}}></span>)}</div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="section-title">{fmtDate(selectedDate)}</div>
      <div className="card tab-accent" style={{"--accent":"var(--gold)"}}>
        {(dayItems.tasks.length===0 && dayItems.events.length===0) ? <Empty glyph="◇" msg="এই দিনে কিছু নেই" /> :
          <React.Fragment>
            {dayItems.tasks.map(t=>(
              <div className="row" key={"t"+t.id}>
                <span className="pill" style={{background:"rgba(166,67,46,0.12)", color:"var(--brick)"}}>টাস্ক</span>
                <div className="row-title">{t.title}</div>
              </div>
            ))}
            {dayItems.events.map(e=>(
              <div className="row" key={"e"+e.id} onClick={()=>openEdit("event", e)}>
                <span className="pill" style={{background:"rgba(184,134,59,0.15)", color:"var(--gold)"}}>ইভেন্ট</span>
                <div style={{flex:1}}>
                  <div className="row-title">{e.title}</div>
                  {e.time && <div className="row-meta">{e.time}</div>}
                </div>
              </div>
            ))}
          </React.Fragment>
        }
      </div>
    </React.Fragment>
  );
}

function DailyLogView({state, setState, updateItem, addItem, uid, openAdd, openEdit, removeItem, prayer}){
  const days = [];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(isoDate(d)); }
  const today = todayIso();
  const [meetingText, setMeetingText] = useState("");
  const [showHistory, setShowHistory] = useState(false);

  const addMeetingPoint = ()=>{
    if(!meetingText.trim()) return;
    addItem("meetingPoints", {id:uid(), text:meetingText.trim(), date:today, carryForward:false, closed:false});
    setMeetingText("");
  };
  const closeMeetingPoint = (id)=> updateItem("meetingPoints", id, {closed:true});
  const toggleCarryForward = (m)=> updateItem("meetingPoints", m.id, {carryForward: !m.carryForward});
  const todaysAgenda = state.meetingPoints.filter(m=>{
    if(m.closed) return false;
    if(m.carryForward) return true;
    return m.date === today;
  }).sort((a,b)=>a.date.localeCompare(b.date));

  const toggle = (habitId, iso)=>{
    setState(s=>{
      const logs = {...s.habitLogs};
      const dayLog = {...(logs[iso]||{})};
      dayLog[habitId] = !dayLog[habitId];
      logs[iso] = dayLog;
      return {...s, habitLogs:logs};
    });
  };

  const prayers = state.habits.filter(h=>h.kind==="prayer");
  const readings = state.habits.filter(h=>h.kind==="reading");
  const custom = state.habits.filter(h=>h.kind==="custom");

  return (
    <React.Fragment>
      <div className="section-title">
        নামাজের সময়সূচি

      </div>
      <div className="card tab-accent" style={{"--accent":"var(--sage)"}}>
        {prayer.status==="error" && (
          <div style={{fontSize:12, color:"var(--brick)", marginBottom:8}}>
            ইন্টারনেট সংযোগ বা লোকেশন এক্সেস ছাড়া নামাজের সময় আনা যায়নি। ফোনে সরাসরি অ্যাপ খুললে এটা কাজ করবে।
          </div>
        )}
        {prayers.map(h=>{
          const on = !!(state.habitLogs[today]||{})[h.id];
          const time = prayer.times ? prayer.times[h.prayerKey] : null;
          return (
            <div className="row" key={h.id}>
              <Chk checked={on} onClick={()=>toggle(h.id, today)} accent="var(--sage)" />
              <div className={"row-title"+(on?" done":"")} style={{flex:1}}>{h.title}</div>
              <span className="row-meta">{time || (prayer.status==="loading" ? "…" : "—")}</span>
            </div>
          );
        })}
      </div>

      <div className="section-title">তিলাওয়াত ও পাঠ</div>
      {readings.map(h=>{
        let streak = 0;
        for(let i=days.length-1;i>=0;i--){
          if((state.habitLogs[days[i]]||{})[h.id]) streak++; else break;
        }
        return (
          <div className="card tab-accent" key={h.id} style={{"--accent":"var(--sage)"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>

              <span className="pill" style={{background:"rgba(91,122,99,0.14)", color:"var(--sage)"}}>{toBn(streak)} দিন ধারা</span>
            </div>
            <div className="habit-week" style={{marginTop:10}}>
              {days.map(iso=>{
                const on = !!(state.habitLogs[iso]||{})[h.id];
                const d = new Date(iso);
                return (
                  <div key={iso} className={"hcell"+(on?" on":"")} onClick={()=>toggle(h.id, iso)}>
                    {BN_DAYS_SHORT[d.getDay()]}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      <div className="section-title">
        অন্যান্য দৈনন্দিন কাজ
        <span className="tag" onClick={()=>openAdd("habit")}>+ নতুন যোগ করো</span>
      </div>
      {custom.length===0 ? (
        <div className="card"><Empty glyph="✎" msg="ম্যানুয়ালি প্রতিদিনের কাজ যোগ করতে + এ ট্যাপ করো" /></div>
      ) : custom.map(h=>{
        let streak = 0;
        for(let i=days.length-1;i>=0;i--){
          if((state.habitLogs[days[i]]||{})[h.id]) streak++; else break;
        }
        return (
          <div className="card tab-accent" key={h.id} style={{"--accent":"var(--sage)"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", gap:8}}>
              <div style={{fontWeight:600, flex:1}}>{h.title}</div>

      </div>
      <div className="card tab-accent" style={{"--accent":"var(--gold)"}}>
        {state.routines.length===0 ? <Empty glyph="◷" msg="সময়সহ দৈনন্দিন রুটিন (যেমন: টিউশন, ক্লাস) যোগ করতে + এ ট্যাপ করো" /> :
          [...state.routines].sort((a,b)=>a.startTime.localeCompare(b.startTime)).map(r=>{
            const active = findActiveRoutine(state.routines, new Date());
            const isNow = active && active.id===r.id;
            return (
              <div className="row" key={r.id} onClick={()=>openEdit("routine", r)}>
                <div style={{flex:1}}>
                  <div className="row-title" style={isNow?{fontWeight:700, color:"var(--gold)"}:{}}>{r.title}</div>

            </div>

      </div>

      {showHistory && (
        <MeetingHistorySheet points={state.meetingPoints} onClose={()=>setShowHistory(false)} />
      )}
    </React.Fragment>
  );
}

function MeetingHistorySheet({points, onClose}){
  const [filterDate, setFilterDate] = useState("");
  const grouped = useMemo(()=>{
    const byDate = {};
    points.forEach(m=>{ (byDate[m.date] = byDate[m.date]||[]).push(m); });
    return Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).map(d=>({date:d, items:byDate[d]}));
  }, [points]);
  const filtered = filterDate ? grouped.filter(g=>g.date===filterDate) : grouped;
  return (
    <Sheet title="পুরাতন আলোচনা" onClose={onClose}>
      <div className="field"><label>তারিখ দিয়ে খোঁজো (ঐচ্ছিক)</label><input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)} /></div>
      {filtered.length===0 ? <Empty glyph="🗒" msg="কোনো তথ্য পাওয়া যায়নি" /> :
        filtered.map(g=>(
          <div key={g.date} style={{marginBottom:16}}>
            <div style={{fontWeight:700, fontSize:13, color:"var(--slate)", marginBottom:6}}>{fmtDate(g.date)}</div>
            {g.items.map(m=>(
              <div className="row" key={m.id}>
                <div style={{flex:1}}>
                  <div className="row-title">{m.text}</div>
                  <div className="row-meta">{m.carryForward ? (m.closed ? "চলমান ছিল · এখন বন্ধ" : "চলমান") : "একবারের জন্য"}</div>
                </div>
              </div>
            ))}
          </div>
        ))
      }
    </Sheet>
  );
}

  {key:"education", label:"শিক্ষা", color:"var(--green)"},
  {key:"health", label:"চিকিৎসা", color:"#B4523F"},
  {key:"other", label:"অন্যান্য", color:"var(--sage)"},
];
const INC_CATS = [
  {key:"salary", label:"বেতন", color:"var(--sage)"},
  {key:"tuition", label:"টিউশন", color:"var(--gold)"},
  {key:"gift", label:"উপহার", color:"var(--plum)"},
  {key:"other", label:"অন্যান্য", color:"var(--slate)"},
];
function catInfo(type, key){
  const list = type==="income" ? INC_CATS : EXP_CATS;
  return list.find(c=>c.key===key) || list[list.length-1];
}
function moneyFmt(n){
  const v = Math.round(Number(n||0));
  const neg = v<0;
  return (neg?"-":"") + "৳" + toBn(Math.abs(v).toLocaleString("en-US"));
}
function accountBalance(state, accId){
  const acc = state.accounts.find(a=>a.id===accId);
  const opening = acc ? Number(acc.openingBalance||0) : 0;
  const delta = state.transactions.filter(t=>t.accountId===accId)
    .reduce((s,t)=> s + (t.type==="income" ? Number(t.amount||0) : -Number(t.amount||0)), 0);
  return opening + delta;
}

// category: "debtor" = যারা আমাকে টাকা দেবে (আমি ধার দিয়েছি), "creditor" = যাদের আমি টাকা দেব (আমি ধার নিয়েছি)
function personDebtBalances(state, category){
  const map = {};
  (state.debts||[]).filter(d=>d.category===category).forEach(d=>{
    const key = d.person;
    if(!(key in map)) map[key] = 0;
    map[key] += (d.type==="add" ? Number(d.amount||0) : -Number(d.amount||0));
  });
  return Object.entries(map)
    .map(([person, balance])=>({person, balance}))
    .filter(x=>Math.abs(x.balance) > 0.001)
    .sort((a,b)=> b.balance - a.balance);
}

function PersonLedgerSheet({state, person, category, addItem, removeItem, uid, onClose, showToast}){
  const entries = (state.debts||[])
    .filter(d=>d.category===category && d.person===person)
    .sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const balance = entries.reduce((s,d)=> s + (d.type==="add" ? Number(d.amount||0) : -Number(d.amount||0)), 0);

  const [entryType, setEntryType] = useState("add");
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const [date, setDate] = useState(todayIso());

  const addLabel = category==="debtor" ? "নতুন ধার দিলাম" : "নতুন ধার নিলাম";
  const paymentLabel = category==="debtor" ? "টাকা ফেরত পেলাম" : "টাকা পরিশোধ করলাম";
  const balanceLabel = category==="debtor" ? "বাকি পাব" : "বাকি দিতে হবে";

  const save = ()=>{
    if(!amount || Number(amount)<=0) return;
    addItem("debts", {id:uid(), person, category, type:entryType, amount:Number(amount), note, date});
    showToast("এন্ট্রি যোগ হয়েছে");
    setAmount(""); setNote("");
  };

  return (
    <Sheet title={person} onClose={onClose}>
      <div className="card" style={{textAlign:"center", margin:"0 0 16px"}}>
        <div style={{fontSize:12.5, color:"var(--muted)"}}>{balanceLabel}</div>
        <div className="exp-total" style={{color: balance>0 ? (category==="debtor"?"var(--sage)":"var(--brick)") : "var(--muted)"}}>
          {moneyFmt(Math.abs(balance))}
        </div>
      </div>

      <div className="field">
        <div className="chip-row">
          <div className={"chip"+(entryType==="add"?" sel":"")} style={{"--accent":"var(--ochre)"}} onClick={()=>setEntryType("add")}>{addLabel}</div>
          <div className={"chip"+(entryType==="payment"?" sel":"")} style={{"--accent":"var(--sage)"}} onClick={()=>setEntryType("payment")}>{paymentLabel}</div>
        </div>
      </div>
      <div className="field"><label>পরিমাণ (৳)</label><input type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="০" /></div>
      <div className="field"><label>নোট (ঐচ্ছিক)</label><input value={note} onChange={e=>setNote(e.target.value)} placeholder="যেমন: ঈদের আগে ধার" /></div>
      <div className="field"><label>তারিখ</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} /></div>
      <button className="btn btn-primary" onClick={save}>যোগ করো</button>

      <div className="section-title" style={{marginTop:18}}>ইতিহাস</div>
      <div className="card tab-accent" style={{"--accent":"var(--ochre)"}}>
        {entries.length===0 ? <Empty glyph="৳" msg="কোনো এন্ট্রি নেই" /> :
          entries.map(d=>{
            const isAdd = d.type==="add";
            return (
              <div className="row" key={d.id}>
                <div style={{flex:1}}>
                  <div className="row-title">{d.note || (isAdd ? addLabel : paymentLabel)}</div>
                  <div className="row-meta">{fmtDate(d.date)}</div>
                </div>
                <div style={{fontWeight:600, color: isAdd ? "var(--ochre)" : "var(--sage)", marginRight:10}}>
                  {isAdd?"+":"-"}{moneyFmt(d.amount)}
                </div>
                <span style={{color:"var(--brick)", fontSize:12.5, cursor:"pointer"}} onClick={()=>removeItem("debts", d.id)}>মুছো</span>
              </div>
            );
          })
        }
      </div>
    </Sheet>
  );
}

function ModalRouter({modal, state, addItem, updateItem, removeItem, uid, onClose, showToast}){
  const {type, data} = modal;
  if(type==="task") return <TaskForm state={state} data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="event") return <EventForm data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="habit") return <HabitForm data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="routine") return <RoutineForm data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="goal") return <GoalForm data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="note") return <NoteForm state={state} data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="transaction") return <TransactionForm state={state} data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="account") return <AccountForm data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  return null;
}

function TaskForm({state, data, addItem, updateItem, removeItem, uid, onClose, showToast}){

  const [priority, setPriority] = useState(data && !preset ? (data.priority||"normal") : "normal");

    <Sheet title={isEdit?"টাস্ক এডিট করো":"নতুন টাস্ক"} onClose={onClose}>
      <div className="field"><label>টাস্কের নাম</label><input autoFocus value={title} onChange={e=>setTitle(e.target.value)} placeholder="যেমন: রুটিন রিপোর্ট জমা দেওয়া" /></div>

function NoteForm({state, data, addItem, updateItem, removeItem, uid, onClose, showToast}){
  const [title, setTitle] = useState(data?(data.title||""):"");
  const [body, setBody] = useState(data?data.body:"");
  const [goalId, setGoalId] = useState(data?(data.goalId||""):"");

    else { addItem("notes", {id:uid(), title, body, goalId: goalId||null, updatedAt:Date.now()}); showToast("নোট যোগ হয়েছে"); }
    onClose();

    <Sheet title={data?"নোট এডিট করো":"নতুন নোট"} onClose={onClose}>

function TransactionForm({state, data, addItem, updateItem, removeItem, uid, onClose, showToast}){
  const [type, setType] = useState(data?data.type:"expense");
  const [amount, setAmount] = useState(data?data.amount:"");
  const [category, setCategory] = useState(data?data.category:"grocery");
  const [accountId, setAccountId] = useState(data?data.accountId:(state.accounts[0]?state.accounts[0].id:""));
  const [note, setNote] = useState(data?(data.note||""):"");
  const [date, setDate] = useState(data?data.date:todayIso());
  const cats = type==="income" ? INC_CATS : EXP_CATS;

  const switchType = (t)=>{
    setType(t);
    const list = t==="income" ? INC_CATS : EXP_CATS;
    if(!list.find(c=>c.key===category)) setCategory(list[0].key);
  };

  const save = ()=>{
    if(!amount || Number(amount)<=0 || !accountId) return;
    const payload = {type, amount:Number(amount), category, accountId, note, date};
    if(data){ updateItem("transactions", data.id, payload); showToast("লেনদেন আপডেট হয়েছে"); }
    else { addItem("transactions", {id:uid(), ...payload}); showToast("লেনদেন যোগ হয়েছে"); }
    onClose();
  };
  return (
    <Sheet title={data?"লেনদেন এডিট করো":"নতুন লেনদেন"} onClose={onClose}>
      <div className="field">
        <div className="chip-row">
          {[["expense","খরচ","var(--brick)"],["income","আয়","var(--sage)"]].map(([k,l,c])=>(
            <div key={k} className={"chip"+(type===k?" sel":"")} style={{"--accent":c}} onClick={()=>switchType(k)}>{l}</div>
          ))}
        </div>
      </div>
      <div className="field"><label>পরিমাণ (৳)</label><input autoFocus type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="০" /></div>
      <div className="field">
        <label>খাত</label>
        <div className="chip-row">
          {cats.map(c=>(
            <div key={c.key} className={"chip"+(category===c.key?" sel":"")} style={{"--accent":c.color}} onClick={()=>setCategory(c.key)}>{c.label}</div>
          ))}
        </div>
      </div>
      <div className="field">
        <label>হিসাব</label>
        <select value={accountId} onChange={e=>setAccountId(e.target.value)}>
          {state.accounts.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
        </select>
      </div>
      <div className="field"><label>নোট (ঐচ্ছিক)</label><input value={note} onChange={e=>setNote(e.target.value)} placeholder="যেমন: রিকশা ভাড়া" /></div>
      <div className="field"><label>তারিখ</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} /></div>
      <button className="btn btn-primary" onClick={save}>সংরক্ষণ করো</button>
      {data && <button className="btn btn-danger" onClick={()=>{removeItem("transactions", data.id); onClose();}}>লেনদেন মুছে ফেলো</button>}
    </Sheet>
  );
}

function AccountForm({data, addItem, updateItem, removeItem, uid, onClose, showToast}){
  const [name, setName] = useState(data?data.name:"");
  const [openingBalance, setOpeningBalance] = useState(data?data.openingBalance:"0");

  return (
    <Sheet title={data?"হিসাব এডিট করো":"নতুন হিসাব"} onClose={onClose}>
      <div className="field"><label>হিসাবের নাম</label><input autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="যেমন: bKash" /></div>
      <div className="field"><label>শুরুর ব্যালেন্স (৳)</label><input type="number" value={openingBalance} onChange={e=>setOpeningBalance(e.target.value)} /></div>

    </Sheet>
  );
}
